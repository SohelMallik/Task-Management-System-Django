name: Deploy TodoManager on AWS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout GitHub repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/todomanager:latest .

      # 5. Push Docker image to Docker Hub
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/todomanager:latest

      # 6. Setup SSH
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_EC2_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.AWS_EC2_IP }}" >> ~/.ssh/known_hosts

      # 7. Deploy to AWS EC2
      - name: Deploy to AWS EC2
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.AWS_EC2_IP }} \
            "DOCKER_USERNAME='$DOCKER_USERNAME' \
             DOCKER_PASSWORD='$DOCKER_PASSWORD' \
             DJANGO_SECRET_KEY='$DJANGO_SECRET_KEY' \
             DB_NAME='$DB_NAME' \
             DB_USER='$DB_USER' \
             DB_PASSWORD='$DB_PASSWORD' \
             DB_HOST='$DB_HOST' \
             bash -s" << 'EOF'

          echo "Logging into Docker Hub..."

          echo "$DOCKER_PASSWORD" | docker login \
            --username "$DOCKER_USERNAME" \
            --password-stdin

          echo "Pulling latest Docker image..."

          docker pull "$DOCKER_USERNAME/todomanager:latest"

          echo "Stopping old container..."

          docker stop todomanager || true

          echo "Removing old container..."

          docker rm todomanager || true

          echo "Starting new container..."

          docker run -d \
            --name todomanager \
            --restart unless-stopped \
            -p 80:8000 \
            -e SECRET_KEY="$DJANGO_SECRET_KEY" \
            -e DEBUG="False" \
            -e DB_NAME="$DB_NAME" \
            -e DB_USER="$DB_USER" \
            -e DB_PASSWORD="$DB_PASSWORD" \
            -e DB_HOST="$DB_HOST" \
            -e DB_PORT="3306" \
            "$DOCKER_USERNAME/todomanager:latest"

          echo "Running Django migrations..."

          docker exec todomanager python manage.py migrate

          echo "Container status:"

          docker ps

          echo "Deployment completed successfully!"

          EOF